[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-langchain-langsmith-demo"
version = "0.1.0"
description = "Demo didáctica de LangChain + LangSmith para diagnóstico, routing y evaluación en S3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.0.0,<2.0.0",
  "langchain-anthropic>=1.1.0,<2.0.0",
  "langsmith>=0.4.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[project.scripts]
s3-demo = "s3_langchain_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
